name: probe waf dom

# Diagnostic only. Dumps the chuangyudun slider captcha DOM / canvas pixels,
# and exercises the slider solver. Not part of the sign flow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install deps and browser
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0 || true
          pip install patchright opencv-python-headless numpy
          python -m patchright install --with-deps chromium

      - name: run slider solver
        env:
          PYTHONIOENCODING: utf-8
        run: python _diag2.py

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-dom
          path: debug/
          if-no-files-found: warn
          retention-days: 14
