name: probe waf dom

# 涓€娆℃€ц瘖鏂敤锛氭妸鍒涘畤鐩鹃獙璇侀〉鐨勭湡瀹?DOM / 鎴浘 dump 鎴?artifact銆?# 涓嶅弬涓庣鍒帮紝璺戝畬鐪嬪畬灏卞彲浠ュ垹銆?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 瀹夎渚濊禆涓庢祻瑙堝櫒鍐呮牳
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0 || true
          pip install patchright
          python -m patchright install --with-deps chromium

      - name: 鎺㈡祴楠岃瘉椤?DOM
        env:
          PYTHONIOENCODING: utf-8
        run: python _probe_canvas.py

      - name: 涓婁紶鎺㈡祴浜х墿
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-dom
          path: debug/
          if-no-files-found: warn
          retention-days: 14
