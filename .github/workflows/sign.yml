name: 52pojie daily sign

# 双跑道设计：
#   sign-local  —— 跑在自建 Windows runner 上，走家庭宽带 IP。52pojie 的创宇盾对数据中心 IP
#                  （GitHub 托管 runner 是 Azure）会直接给「滑动拼图」，家宽 IP 通常连验证码都不给。
#                  这是主跑道。
#   sign-cloud  —— GitHub 托管 ubuntu runner，仅在本机跑道失败（或手动勾 use_cloud）时兜底。
#
# GitHub 自己的 schedule 对这个账号时灵时不灵（2026-11-22 起偶尔入队，但延迟 7~8 小时），
# 准点触发靠本机 schtasks（run_now.ps1）+ 常驻 runner。

on:
  schedule:
    - cron: "40 1 * * *"   # UTC 01:40 = 北京 09:40
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只探测不提交（不会真的签到）"
        type: boolean
        default: false
      test_notify:
        description: "只测 Telegram 通知通道（不访问站点）"
        type: boolean
        default: false
      use_cloud:
        description: "强制用 GitHub 托管 runner（数据中心 IP，可能要求滑动拼图）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: 52pojie-sign
  cancel-in-progress: false

jobs:
  # ───────────────────────── 主跑道：家宽 IP ─────────────────────────
  sign-local:
    if: ${{ !inputs.use_cloud }}
    runs-on: [self-hosted, windows, local]
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: D:\ms-playwright
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PJ52_COOKIE: ${{ secrets.PJ52_COOKIE }}
      PJ52_USER: ${{ secrets.PJ52_USER }}
      PJ52_PASS: ${{ secrets.PJ52_PASS }}
      PJ52_DEBUG: "1"
      PJ52_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      PJ52_TEST_NOTIFY: ${{ inputs.test_notify && '1' || '' }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_NOTIFY_LEVEL: ${{ vars.TG_NOTIFY_LEVEL || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - name: 环境自检
        shell: pwsh
        run: |
          python --version
          $chrome = Join-Path $env:PLAYWRIGHT_BROWSERS_PATH 'chromium-1208\chrome-win64\chrome.exe'
          if (Test-Path $chrome) {
            Write-Host "browser: $chrome"
          } else {
            Write-Host "browser missing -> installing"
            python -m patchright install chromium
          }
          python -c "import ddddocr; print('ddddocr ok')"

      - name: 执行签到
        shell: pwsh
        run: python sign.py

      - name: 上传调试产物（截图 + HTML）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-local-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: 回写新 Cookie 到 secret（自动登录后自动续期）
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Host "未配置 GH_PAT，跳过自动续期"; exit 0 }
          if (-not (Test-Path new_cookie.txt)) { Write-Host "本次没有产生新 Cookie，跳过"; exit 0 }
          $c = (Get-Content new_cookie.txt -Raw).Trim()
          if (-not $c) { Write-Host "new_cookie.txt 为空，跳过"; exit 0 }
          $gh = 'C:\Program Files\GitHub CLI\gh.exe'
          if (-not (Test-Path $gh)) { $gh = 'gh' }
          & $gh secret set PJ52_COOKIE --repo "$env:GITHUB_REPOSITORY" --body $c
          Write-Host "已把新 Cookie 写回 PJ52_COOKIE"

  # ───────────────────────── 兜底跑道：托管 runner ─────────────────────────
  sign-cloud:
    needs: sign-local
    if: ${{ always() && (inputs.use_cloud || needs.sign-local.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖与浏览器内核
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0 || true
          pip install -r requirements.txt
          python -m patchright install --with-deps chromium || python -m playwright install --with-deps chromium

      - name: 执行签到（云通道）
        env:
          PJ52_COOKIE: ${{ secrets.PJ52_COOKIE }}
          PJ52_USER: ${{ secrets.PJ52_USER }}
          PJ52_PASS: ${{ secrets.PJ52_PASS }}
          PJ52_DEBUG: "1"
          PJ52_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          PJ52_TEST_NOTIFY: ${{ inputs.test_notify && '1' || '' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_NOTIFY_LEVEL: ${{ vars.TG_NOTIFY_LEVEL || 'all' }}
        run: python sign.py

      - name: 上传调试产物（截图 + HTML）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-cloud-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
