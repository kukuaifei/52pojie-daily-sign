name: 52pojie daily sign

# 主跑道：GitHub 托管 runner（ubuntu-latest）。
#   创宇盾对数据中心 IP 会下发「滑动拼图」，sign.py 里的 solve_slider() 会自动过：
#   块位移 = 滑块位移 × 13/14（CSS 缩放），缺口用 ccoeff + 边缘模板投票定位。
# 备用跑道：自建 Windows runner（家宽 IP，通常连验证码都不给），手动勾 local_only 才跑。

on:
  schedule:
    - cron: "40 1 * * *"   # UTC 01:40 = 北京 09:40
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只探测不提交（不会真的签到）"
        type: boolean
        default: false
      test_notify:
        description: "只测 Telegram 通知通道（不访问站点）"
        type: boolean
        default: false
      local_only:
        description: "改用自建 Windows runner（家宽 IP，需本机在线）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: 52pojie-sign
  cancel-in-progress: false

jobs:
  # ───────────────────────── 主跑道：GitHub 托管 runner ─────────────────────────
  sign-cloud:
    if: ${{ !inputs.local_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖与浏览器内核
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0 || true
          pip install -r requirements.txt
          python -m patchright install --with-deps chromium || python -m playwright install --with-deps chromium

      - name: 执行签到
        env:
          PJ52_COOKIE: ${{ secrets.PJ52_COOKIE }}
          PJ52_USER: ${{ secrets.PJ52_USER }}
          PJ52_PASS: ${{ secrets.PJ52_PASS }}
          PJ52_DEBUG: "1"
          PJ52_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          PJ52_TEST_NOTIFY: ${{ inputs.test_notify && '1' || '' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_NOTIFY_LEVEL: ${{ vars.TG_NOTIFY_LEVEL || 'all' }}
        run: |
          python sign.py
          rc=$?
          echo "EXIT_CODE=$rc"
          exit $rc

      - name: 上传调试产物（截图 + HTML）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-cloud-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: 回写新 Cookie 到 secret（自动登录后自动续期）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then echo "GH_PAT not set, skip cookie persist"; exit 0; fi
          if [ ! -f new_cookie.txt ]; then echo "no new cookie this run, skip"; exit 0; fi
          c="$(tr -d '\r\n' < new_cookie.txt)"
          if [ -z "$c" ]; then echo "new_cookie.txt empty, skip"; exit 0; fi
          gh secret set PJ52_COOKIE --repo "$GITHUB_REPOSITORY" --body "$c"
          echo "cookie persisted to PJ52_COOKIE"

  # ───────────────────────── 备用跑道：自建 Windows runner（家宽 IP） ─────────────────────────
  sign-local:
    if: ${{ inputs.local_only }}
    runs-on: [self-hosted, windows, local]
    timeout-minutes: 20
    defaults:
      run:
        shell: 'powershell -ExecutionPolicy Bypass -File {0}'
    env:
      PLAYWRIGHT_BROWSERS_PATH: D:\ms-playwright
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # 本机 runner 以 NETWORK SERVICE 运行，读不到用户级系统代理；Telegram 直连会被重置。
      HTTP_PROXY: http://127.0.0.1:7897
      HTTPS_PROXY: http://127.0.0.1:7897
      NO_PROXY: www.52pojie.cn,static.52pojie.cn,localhost,127.0.0.1
      TG_INSECURE_SSL: "1"
      PJ52_COOKIE: ${{ secrets.PJ52_COOKIE }}
      PJ52_USER: ${{ secrets.PJ52_USER }}
      PJ52_PASS: ${{ secrets.PJ52_PASS }}
      PJ52_DEBUG: "1"
      PJ52_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      PJ52_TEST_NOTIFY: ${{ inputs.test_notify && '1' || '' }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_NOTIFY_LEVEL: ${{ vars.TG_NOTIFY_LEVEL || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - name: 环境自检
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $py = 'D:\Python311\python.exe'
          if (-not (Test-Path $py)) { $py = 'python' }
          Write-Host "python: $py"
          & $py --version
          $chrome = Join-Path $env:PLAYWRIGHT_BROWSERS_PATH 'chromium-1208\chrome-win64\chrome.exe'
          if (Test-Path $chrome) {
            Write-Host "browser: $chrome"
          } else {
            Write-Host "browser missing -> installing"
            & $py -m patchright install chromium
          }
          & $py -c "import ddddocr; print('ddddocr ok')"
          Write-Host "cwd: $(Get-Location)"

      - name: 执行签到
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $py = 'D:\Python311\python.exe'
          if (-not (Test-Path $py)) { $py = 'python' }
          & $py sign.py
          $rc = $LASTEXITCODE
          Write-Host "EXIT_CODE=$rc"
          exit $rc

      - name: 上传调试产物（截图 + HTML）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-local-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: 回写新 Cookie 到 secret（自动登录后自动续期）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          if (-not $env:GH_TOKEN) { Write-Host "GH_PAT not set, skip cookie persist"; exit 0 }
          if (-not (Test-Path new_cookie.txt)) { Write-Host "no new cookie this run, skip"; exit 0 }
          $c = (Get-Content new_cookie.txt -Raw).Trim()
          if (-not $c) { Write-Host "new_cookie.txt empty, skip"; exit 0 }
          $gh = 'C:\Program Files\GitHub CLI\gh.exe'
          if (-not (Test-Path $gh)) { $gh = 'gh' }
          & $gh secret set PJ52_COOKIE --repo "$env:GITHUB_REPOSITORY" --body $c
          Write-Host "cookie persisted to PJ52_COOKIE"
