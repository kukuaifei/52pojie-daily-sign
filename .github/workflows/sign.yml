name: 52pojie daily sign

on:
  schedule:
    # UTC 01:20 = 北京时间 09:20；避开整点风控更严的时段，GitHub 定时通常会延迟几分钟到半小时
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只探测不提交（不会真的签到）"
        type: boolean
        default: false
      test_notify:
        description: "只测 Telegram 通知通道（不访问站点）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: 52pojie-sign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖与浏览器内核
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0 || true
          pip install -r requirements.txt
          python -m patchright install --with-deps chromium || python -m playwright install --with-deps chromium

      - name: 执行签到
        env:
          PJ52_COOKIE: ${{ secrets.PJ52_COOKIE }}
          PJ52_USER: ${{ secrets.PJ52_USER }}
          PJ52_PASS: ${{ secrets.PJ52_PASS }}
          PJ52_DEBUG: "1"
          PJ52_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          PJ52_TEST_NOTIFY: ${{ inputs.test_notify && '1' || '' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_NOTIFY_LEVEL: ${{ vars.TG_NOTIFY_LEVEL || 'all' }}
        run: python sign.py

      - name: 回写新 Cookie 到 secret（自动登录后自动续期）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "未配置 GH_PAT，跳过自动续期（Cookie 失效时需手动更新）"
            exit 0
          fi
          if [ ! -s new_cookie.txt ]; then
            echo "本次没有产生新 Cookie，跳过"
            exit 0
          fi
          gh secret set PJ52_COOKIE --repo "$GITHUB_REPOSITORY" --body "$(cat new_cookie.txt)"
          echo "已把新 Cookie 写回 PJ52_COOKIE，下次运行直接复用"

      - name: 上传调试产物（截图 + HTML）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
