name: 52pojie daily sign

# 鍙岃窇閬撹璁★細
#   sign-local  鈥斺€?璺戝湪鑷缓 Windows runner锛堟湰鏈烘湇鍔★紝瀹跺 IP锛夈€?2pojie 鐨勫垱瀹囩浘瀵规暟鎹腑蹇?IP
#                  锛圙itHub 鎵樼 runner 鏄?Azure锛変細鐩存帴缁欍€屾粦鍔ㄦ嫾鍥俱€嶏紝瀹跺 IP 閫氬父杩為獙璇佺爜閮戒笉缁欍€?#                  杩欐槸涓昏窇閬撱€?#   sign-cloud  鈥斺€?GitHub 鎵樼 ubuntu runner锛屼粎鍦ㄦ湰鏈鸿窇閬撳け璐ワ紙鎴栨墜鍔ㄥ嬀 use_cloud锛夋椂鍏滃簳銆?#
# 娉ㄦ剰锛氭湰鏈?runner 浠?NT AUTHORITY\NETWORK SERVICE 杩愯锛屾満鍣ㄤ笂娌℃湁 pwsh锛圥owerShell 7锛夛紝
# 鎵€浠ユ墍鏈?shell 鐢?powershell锛?.1锛夈€?
on:
  schedule:
    - cron: "40 1 * * *"   # UTC 01:40 = 鍖椾含 09:40
  workflow_dispatch:
    inputs:
      dry_run:
        description: "鍙帰娴嬩笉鎻愪氦锛堜笉浼氱湡鐨勭鍒帮級"
        type: boolean
        default: false
      test_notify:
        description: "鍙祴 Telegram 閫氱煡閫氶亾锛堜笉璁块棶绔欑偣锛?
        type: boolean
        default: false
      use_cloud:
        description: "寮哄埗鐢?GitHub 鎵樼 runner锛堟暟鎹腑蹇?IP锛屽彲鑳借姹傛粦鍔ㄦ嫾鍥撅級"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: 52pojie-sign
  cancel-in-progress: false

jobs:
  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€ 涓昏窇閬擄細瀹跺 IP 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  sign-local:
    if: ${{ !inputs.use_cloud }}
    runs-on: [self-hosted, windows, local]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      PLAYWRIGHT_BROWSERS_PATH: D:\ms-playwright
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PJ52_COOKIE: ${{ secrets.PJ52_COOKIE }}
      PJ52_USER: ${{ secrets.PJ52_USER }}
      PJ52_PASS: ${{ secrets.PJ52_PASS }}
      PJ52_DEBUG: "1"
      PJ52_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      PJ52_TEST_NOTIFY: ${{ inputs.test_notify && '1' || '' }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_NOTIFY_LEVEL: ${{ vars.TG_NOTIFY_LEVEL || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - name: 鐜鑷
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $py = 'D:\Python311\python.exe'
          if (-not (Test-Path $py)) { $py = 'python' }
          Write-Host "python: $py"
          & $py --version
          $chrome = Join-Path $env:PLAYWRIGHT_BROWSERS_PATH 'chromium-1208\chrome-win64\chrome.exe'
          if (Test-Path $chrome) {
            Write-Host "browser: $chrome"
          } else {
            Write-Host "browser missing -> installing"
            & $py -m patchright install chromium
          }
          & $py -c "import ddddocr; print('ddddocr ok')"
          Write-Host "cwd: $(Get-Location)"

      - name: 鎵ц绛惧埌
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $py = 'D:\Python311\python.exe'
          if (-not (Test-Path $py)) { $py = 'python' }
          & $py sign.py
          $rc = $LASTEXITCODE
          Write-Host "EXIT_CODE=$rc"
          exit $rc

      - name: 涓婁紶璋冭瘯浜х墿锛堟埅鍥?+ HTML锛?        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-local-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: 鍥炲啓鏂?Cookie 鍒?secret锛堣嚜鍔ㄧ櫥褰曞悗鑷姩缁湡锛?        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          if (-not $env:GH_TOKEN) { Write-Host "GH_PAT not set, skip cookie persist"; exit 0 }
          if (-not (Test-Path new_cookie.txt)) { Write-Host "no new cookie this run, skip"; exit 0 }
          $c = (Get-Content new_cookie.txt -Raw).Trim()
          if (-not $c) { Write-Host "new_cookie.txt empty, skip"; exit 0 }
          $gh = 'C:\Program Files\GitHub CLI\gh.exe'
          if (-not (Test-Path $gh)) { $gh = 'gh' }
          & $gh secret set PJ52_COOKIE --repo "$env:GITHUB_REPOSITORY" --body $c
          Write-Host "cookie persisted to PJ52_COOKIE"

  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€ 鍏滃簳璺戦亾锛氭墭绠?runner 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  sign-cloud:
    needs: sign-local
    if: ${{ always() && (inputs.use_cloud || needs.sign-local.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 瀹夎渚濊禆涓庢祻瑙堝櫒鍐呮牳
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0 || true
          pip install -r requirements.txt
          python -m patchright install --with-deps chromium || python -m playwright install --with-deps chromium

      - name: 鎵ц绛惧埌锛堜簯閫氶亾锛?        env:
          PJ52_COOKIE: ${{ secrets.PJ52_COOKIE }}
          PJ52_USER: ${{ secrets.PJ52_USER }}
          PJ52_PASS: ${{ secrets.PJ52_PASS }}
          PJ52_DEBUG: "1"
          PJ52_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          PJ52_TEST_NOTIFY: ${{ inputs.test_notify && '1' || '' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_NOTIFY_LEVEL: ${{ vars.TG_NOTIFY_LEVEL || 'all' }}
        run: python sign.py

      - name: 涓婁紶璋冭瘯浜х墿锛堟埅鍥?+ HTML锛?        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-cloud-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
